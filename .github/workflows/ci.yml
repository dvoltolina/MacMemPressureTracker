name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: format, lint, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dev dependencies
        run: |
          brew update
          brew install bats-core shellcheck shfmt

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test
